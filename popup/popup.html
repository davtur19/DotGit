<!DOCTYPE html>
<html lang="en">
<head>
    <title>DotGit</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../lib/materialize.min.css"/>

    <link rel="stylesheet" href="popup.css"/>
    <base target="_blank">
    <script src="dsstore_parser.js"></script>
    <script src="popup.js"></script>
</head>
<body class="darken-3 custom-color">
<div id="permissions-banner" style="display: none; padding: 10px; text-align: center; background-color: #ffeb3b; color: black;">
    <p>DotGit needs permissions to check websites for exposed Git repositories.</p>
    <button id="request-permissions" class="waves-effect waves-light btn">Grant Permissions</button>
</div>
<nav>
    <div class="nav-wrapper darken-3 custom-color">
        <a class="left brand-logo">DotGit</a>
        <ul class="right">
            <li><a><i class="material-icons" title="About" id="about"><img src="../icons/info.svg" alt=""></i></a></li>
            <li><a><i class="material-icons" title="Settings" id="options"><img src="../icons/settings.svg" alt=""></i></a></li>
            <li><a><i class="material-icons" title="Delete all" id="reset"><img src="../icons/delete_forever.svg" alt=""></i></a></li>
        </ul>
    </div>
</nav>
<ul class="collection" id="hostsFound">
    <li class="collection-item center" id="hostsFoundTitle">Total found: 0 Max shown: 100</li>
</ul>
</body>
</html>
